[project]
name = "bounded-calcs"
version = "0.1.0"
description = "Clinical risk calculators that treat unknown as unknown: exact score bounds, settled or unsettled decisions, and the questions worth asking. Python library and MCP server. Research use, not a medical device."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolás Vera Zúñiga" }]
requires-python = ">=3.11"
keywords = [
    "clinical decision support",
    "medical calculators",
    "risk scores",
    "missing data",
    "emergency medicine",
    "mcp",
    "model context protocol",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["pyyaml>=6.0.1"]

[project.urls]
Homepage = "https://github.com/nicoveraz/bounded-calcs"
Repository = "https://github.com/nicoveraz/bounded-calcs"
Issues = "https://github.com/nicoveraz/bounded-calcs/issues"
Paper = "https://arxiv.org/abs/2609.34112"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
bounded-calcs-mcp = "bounded_calcs.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "mcp>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Core metadata is pinned to 2.4: newer hatchling releases emit 2.5 by default, and uploads
# with 2.5 have been rejected by PyPI. Raise it once PyPI is known to accept it.
[tool.hatch.build.targets.wheel]
packages = ["src/bounded_calcs"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
