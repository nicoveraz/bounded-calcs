id: cha2ds2_vasc
name: CHA2DS2-VASc stroke risk score
version: 1
purpose: >-
  Risk of stroke and thromboembolism in patients with atrial fibrillation: low (0),
  intermediate (1) or high (2 or more).
citation: >-
  Lip GYH, Nieuwlaat R, Pisters R, Lane DA, Crijns HJGM. Refining clinical risk stratification
  for predicting stroke and thromboembolism in atrial fibrillation using a novel risk
  factor-based approach: the Euro Heart Survey on atrial fibrillation. Chest
  2010;137(2):263-272. doi:10.1378/chest.09-1584. PMID 19762550. Table 2 (points) and methods
  (risk categories). [P]
higher_is_higher_risk: true
notes:
  - "Points (Lip 2010, table 2): congestive heart failure or LV dysfunction 1; hypertension 1;
    age 75 years or more 2; diabetes mellitus 1; stroke, TIA or thromboembolism 2; vascular
    disease 1; age 65 to 74 years 1; sex category (female) 1. Maximum 9."
  - "TODO(physician-review): categories 0 low, 1 intermediate, 2 or more high are the
    paper's categorisation of the scheme in its methods. Later guidance treats female sex
    differently; that is not in this source and is not implemented."
  - "Source read from a PDF supplied by the author on 2026-11-11: table 2, its footnotes and
    the methods lines on categories."

items:
  - id: chf_or_lv_dysfunction
    label: Congestive heart failure or left ventricular dysfunction
    type: boolean
    kind: finding
  - id: hypertension
    label: Hypertension
    type: boolean
    kind: finding
  - id: age
    label: Age
    type: numeric
    kind: measurement
    unit: years
    accepts: [18, 110]
    notes:
      - Accepted range taken from calc-bounds (docs/CALCULATOR_NOTES.md, parameter modelling choices).
      - "TODO(physician-review): ages below 18 are rejected (18 to 110 years, the range the
        other adult calculators use); the parts read state no age range."
  - id: diabetes
    label: Diabetes mellitus
    type: boolean
    kind: finding
  - id: prior_stroke_tia_or_thromboembolism
    label: Previous stroke, transient ischaemic attack or thromboembolism
    type: boolean
    kind: finding
  - id: vascular_disease
    label: >-
      Vascular disease: prior myocardial infarction, peripheral artery disease, or aortic
      plaque
    type: boolean
    kind: finding
  - id: sex
    label: Sex
    type: ordinal
    kind: finding
    levels: [male, female]

components:
  - {id: chf, label: Congestive heart failure/LV dysfunction, rule: present, item: chf_or_lv_dysfunction, points: 1}
  - {id: hypertension, label: Hypertension, rule: present, item: hypertension, points: 1}
  - id: age
    label: Age >= 75 y (2) or 65-74 y (1)
    rule: bands
    item: age
    bands:
      - {gte: 75, points: 2}
      - {gte: 65, points: 1}
      - {points: 0}
  - {id: diabetes, label: Diabetes mellitus, rule: present, item: diabetes, points: 1}
  - {id: stroke, label: Stroke/TIA/TE, rule: present, item: prior_stroke_tia_or_thromboembolism, points: 2}
  - {id: vascular_disease, label: Vascular disease, rule: present, item: vascular_disease, points: 1}
  - id: sex_category
    label: Sex category (female)
    rule: levels
    item: sex
    points: {male: 0, female: 1}

categories:
  - name: low
    label: Low risk (score 0)
  - name: intermediate
    label: Intermediate risk (score 1)
    min: 1
  - name: high
    label: High risk (score 2 or more)
    min: 2
