id: heart
name: HEART score
version: 1
purpose: Risk of major adverse cardiac events in adult emergency department patients with chest pain.
citation: >-
  Six AJ, Backus BE, Kelder JC. Chest pain in the emergency room: value of the HEART score.
  Neth Heart J 2008;16(6):191-196. doi:10.1007/BF03086144. PMID 18665203. [P]
references:
  - Backus BE et al. Crit Pathw Cardiol 2010;9(3):164-169. doi:10.1097/HPC.0b013e3181ec36d8. PMID 20802272. [P]
  - Backus BE et al. Int J Cardiol 2013;168(3):2153-2158. doi:10.1016/j.ijcard.2013.01.255. PMID 23465250. [P]
  - Backus BE et al. Curr Cardiol Rev 2011;7(1):2-8. PMC3131711 (Table V). [P]
  - Poldervaart JM et al. BMC Cardiovasc Disord 2013;13:77. PMC3849098. [P]
higher_is_higher_risk: true
notes:
  - Ported from calc-bounds (github.com/nicoveraz/calc-bounds), heart.py.
  - Readings reviewed and accepted by the author, an emergency physician, on 2026-09-27
    (calc-bounds docs/CALCULATOR_NOTES.md). Item notes that start with the review marker give
    the reading implemented and the alternatives considered.
  - "Source read 2026-11-12: Backus 2010 (PDF from the author) and Backus 2013 (publisher's
    site) in full. Neither changes the scoring implemented. What each says on the reviewed
    points is quoted in the item notes."

items:
  - id: heart_history
    label: History (clinician judgement of anginal suspicion)
    type: ordinal
    kind: judgment
    levels: [slightly_suspicious, moderately_suspicious, highly_suspicious]
    question: How suspicious is the history for acute coronary syndrome (slightly, moderately, highly)?

  - id: heart_ecg
    label: ECG
    type: ordinal
    kind: finding
    levels: [normal, nonspecific_repolarization, significant_st_deviation]
    question: How is the ECG (normal, nonspecific repolarization disturbance, significant ST deviation)?
    notes:
      - "REVIEWED(physician): 2 points for significant ST deviation, depression or elevation
        (Six 2008 text, MDCalc). The Six 2008 table says ST depression only."
      - "Source read 2026-11-12: Backus 2010 text gives 2 points for 'significant ST-segment
        depressions or elevations in absence of a bundle branch block, left ventricular
        hypertrophy, or the use of digoxin', and 1 point for repolarisation abnormalities
        without significant ST deviation, bundle branch block, pacemaker rhythm, left
        ventricular hypertrophy, probable digoxin effect, or unchanged known repolarisation
        disturbances. The tables of Backus 2010 and 2013 say 'significant ST-depression'."

  - id: age
    label: Age
    type: numeric
    kind: measurement
    unit: years
    accepts: [18, 110]
    notes:
      - Accepted range taken from calc-bounds (docs/CALCULATOR_NOTES.md, parameter modelling choices).
      - "TODO(physician-review): ages below 18 are rejected as outside what this calculator accepts (18 to 110 years, the range calc-bounds uses for this adult score). The alternative is a wider range that only catches impossible ages and leaves applicability to the note in purpose."
      - "REVIEWED(physician): age 45 scores 1 point and age 65 scores 2 (Six 2008 text, '65 years
        or older'). Poldervaart 2013 gives 0 points at 45; the Six 2008 table prints '<= 65' for
        2 points, treated as a typo."
      - "Source read 2026-11-12: Backus 2010 text: 0 points 'younger than 45 years', 1 point
        '45 to 65 years', 2 points '65 years or older' (as implemented); its table and the
        Backus 2013 table print '<= 45 year' for 0 points, which would give age 45 no point."

  - id: hypertension
    label: Diagnosed and/or treated hypertension
    type: boolean
    kind: finding
  - id: hypercholesterolemia
    label: Diagnosed hypercholesterolaemia
    type: boolean
    kind: finding
  - id: diabetes
    label: Diabetes mellitus
    type: boolean
    kind: finding
  - id: obesity
    label: Obesity (BMI > 30)
    type: boolean
    kind: finding
    notes:
      - "REVIEWED(physician): BMI > 30 (Poldervaart 2013); not defined in Six 2008."
      - "Source read 2026-11-12: Backus 2010 also says 'obesity (body mass index > 30)'."
  - id: smoking
    label: Current smoker, or stopped within the last 3 months
    type: boolean
    kind: finding
    notes:
      - "REVIEWED(physician): stopped within 3 months still counts (MDCalc). Six 2008 says
        within 1 month."
      - "Source read 2026-11-12: Backus 2010 says 'current or recent (< 90 days) smoker'."
  - id: family_history_cad
    label: Family history of coronary artery disease (first-degree relative before age 65)
    type: boolean
    kind: finding
    notes:
      - "REVIEWED(physician): first-degree relative with coronary artery disease before age 65."
  - id: atherosclerotic_disease
    label: Known atherosclerotic disease (prior MI, revascularization, stroke or TIA, peripheral arterial disease)
    type: boolean
    kind: finding
    notes:
      - "REVIEWED(physician): TIA counts as atherosclerotic disease (MDCalc). Six 2008 lists
        revascularisation, MI, stroke and peripheral arterial disease."
      - "Source read 2026-11-12: Backus 2010 lists coronary revascularisation, myocardial
        infarction, stroke or peripheral arterial disease; TIA is not named."

  - id: heart_troponin
    label: Initial troponin relative to the assay's upper reference limit
    type: ordinal
    kind: measurement
    levels: [le_normal, 1_to_3x_normal, gt_3x_normal]
    question: What was the initial troponin relative to the assay's upper reference limit?
    notes:
      - "REVIEWED(physician): bands are at or below the limit / 1 to 3 times / more than 3
        times, following the validation cohorts (Backus 2010 and 2013, Poldervaart 2013). Six
        2008 used 1 to 2 times / more than 2 times. Exactly 3 times is the upper band in Backus
        2011 and Poldervaart and the middle band in MDCalc: decide when choosing the level."
      - "Source read 2026-11-12: Backus 2010 text: below the threshold for positivity 0 points,
        between 1 and 3 times the threshold 1 point, higher than 3 times 2 points; its table
        says '>= 3x normal limit' for 2 points. Backus 2013 table: '<= normal limit' 0,
        '> 1 to < 3x normal limit' 1, '>= 3x normal limit' 2. Only the first troponin value was
        used, read against each hospital's own reference value."
      - The level is relative to the assay's upper reference limit. Converting a raw
        concentration needs that limit, so it is done by the caller, not here.

components:
  - id: history
    label: History
    rule: levels
    item: heart_history
    points: {slightly_suspicious: 0, moderately_suspicious: 1, highly_suspicious: 2}

  - id: ecg
    label: ECG
    rule: levels
    item: heart_ecg
    points: {normal: 0, nonspecific_repolarization: 1, significant_st_deviation: 2}

  - id: age
    label: Age
    rule: bands
    item: age
    bands:
      - {gte: 65, points: 2}
      - {gte: 45, points: 1}
      - {points: 0}

  - id: risk_factors
    label: Risk factors
    rule: count
    items: [hypertension, hypercholesterolemia, diabetes, obesity, smoking, family_history_cad]
    points:
      - {gte: 3, points: 2}
      - {gte: 1, points: 1}
      - {points: 0}
    override: atherosclerotic_disease
    override_points: 2

  - id: troponin
    label: Troponin
    rule: levels
    item: heart_troponin
    points: {le_normal: 0, 1_to_3x_normal: 1, gt_3x_normal: 2}

categories:
  - name: low
    label: Low (0-3)
  - name: moderate
    label: Moderate (4-6)
    min: 4
  - name: high
    label: High (7-10)
    min: 7
