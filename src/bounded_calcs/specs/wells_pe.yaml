id: wells_pe
name: Wells criteria for pulmonary embolism (two-tier)
version: 1
purpose: Pretest probability of pulmonary embolism, dichotomized as PE likely / PE unlikely.
citation: >-
  Wells PS, Anderson DR, Rodger M, et al. Derivation of a simple clinical model to categorize
  patients probability of pulmonary embolism: increasing the models utility with the SimpliRED
  D-dimer. Thromb Haemost 2000;83(3):416-420. PMID 10744147. [A]
references:
  - van Belle A, et al. (Christopher Study). JAMA 2006;295(2):172-179. PMID 16403929 (two-tier cut-off). [A]
  - NICE guideline NG158, Table 2 (item wording). [S]
higher_is_higher_risk: true
notes:
  - Ported from calc-bounds (github.com/nicoveraz/calc-bounds), wells_pe.py.
  - Readings reviewed and accepted by the author, an emergency physician, on 2026-09-27
    (calc-bounds docs/CALCULATOR_NOTES.md). The primary papers were read as abstracts only;
    item wording follows NICE NG158.
  - Scores move in half-point steps, so "more than 4" starts at 4.5.

items:
  - id: dvt_signs
    label: Clinical signs of DVT (minimum leg swelling and pain on palpation of the deep veins)
    type: boolean
    kind: finding
  - id: pe_most_likely
    label: Alternative diagnosis less likely than PE (clinician judgement)
    type: boolean
    kind: judgment
    question: Is an alternative diagnosis less likely than PE?
    notes:
      - "REVIEWED(physician): 'alternative diagnosis less likely than PE' (NICE). MDCalc words
        it as 'PE is the #1 diagnosis or equally likely'."
  - id: heart_rate
    label: Heart rate
    type: numeric
    kind: measurement
    unit: /min
    accepts: [20, 250]
    normal: [60, 99]
    notes:
      - Accepted range taken from calc-bounds (docs/CALCULATOR_NOTES.md, parameter modelling choices).
      - "Normal range 60 to 99 /min, used when the source says only that it is
        normal. Taken from calc-bounds (params.py, absent_means), reviewed by the author on
        2026-09-27; it crosses no threshold of any calculator that uses this item."
  - id: immobilization_or_surgery
    label: Immobilisation > 3 days or surgery in the previous 4 weeks
    type: boolean
    kind: finding
    notes:
      - "REVIEWED(physician): immobilisation for more than 3 days (NICE); MDCalc says 3 days or
        more. The 4-week window is read as applying to both immobilisation and surgery."
  - id: prior_vte
    label: Previous DVT or PE
    type: boolean
    kind: finding
  - id: hemoptysis
    label: Haemoptysis
    type: boolean
    kind: finding
  - id: malignancy
    label: Active malignancy (on treatment, treated within 6 months, or palliative)
    type: boolean
    kind: finding

components:
  - {id: dvt_signs, label: Clinical signs of DVT, rule: present, item: dvt_signs, points: 3}
  - {id: pe_most_likely, label: Alternative diagnosis less likely, rule: present, item: pe_most_likely, points: 3}
  - id: heart_rate
    label: Heart rate > 100
    rule: bands
    item: heart_rate
    bands:
      - {gt: 100, points: 1.5}
      - {points: 0}
  - {id: immobilization_or_surgery, label: Immobilisation or surgery, rule: present, item: immobilization_or_surgery, points: 1.5}
  - {id: prior_vte, label: Previous DVT or PE, rule: present, item: prior_vte, points: 1.5}
  - {id: hemoptysis, label: Haemoptysis, rule: present, item: hemoptysis, points: 1}
  - {id: malignancy, label: Malignancy, rule: present, item: malignancy, points: 1}

categories:
  - name: pe_unlikely
    label: PE unlikely (<= 4)
  - name: pe_likely
    label: PE likely (> 4)
    gt: 4
